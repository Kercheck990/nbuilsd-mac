name: Build iOS IPA (from Windows via GitHub)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS unsigned (no Team)
        run: |
          echo "Attempt device build with --no-codesign"
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://nftgrade.freesrv.com --verbose || echo "device build failed, try simulator"
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Device Runner.app found"
            mkdir -p build/ios/ipa
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../ipa/Runner-unsigned-ipa-device.ipa Payload
            rm -rf Payload
            cd ../../..
            ls -lh build/ios/ipa/
            exit 0
          fi
          echo "Fallback: simulator build"
          flutter build ios --simulator --debug --dart-define=API_BASE_URL=https://nftgrade.freesrv.com --verbose
          mkdir -p build/ios/ipa
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            cd build/ios/iphonesimulator
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../../ipa/Runner-unsigned-ipa-sim.ipa Payload
            rm -rf Payload
            cd ../../..
          fi
          ls -R build/ios || true
          ls -lh build/ios/ipa/ || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
